[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "anthropic>=0.40",
    "claude-agent-sdk>=0.1.60",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]